name: build

on:
  push:
  pull_request:

jobs:
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tests fatigue / protocole
        run: node web/test/fatigue.test.js

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: PlatformIO
        run: pip install platformio
      - name: Compiler firmware
        working-directory: firmware
        run: pio run
