; Banc de traction — Lycée Antonin Artaud / BTS MS / FabLab
; Cible : ESP32-WROOM-32 DevKitC-V4 (carte EasyEDA, HX711 U1 DT=25 SCK=33)
;
; Flash firmware :  pio run -e esp32dev -t upload
; Flash pages web : pio run -e esp32dev -t uploadfs
; (les deux, dans cet ordre, après branchement USB)
; Les pages web/ sont recopiées dans data/ avant uploadfs (extra_script).

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DASYNCWEBSERVER_REGEX=0
extra_scripts = pre:extra_script.py
lib_deps =
  esphome/AsyncTCP-esphome@2.1.4
  esphome/ESPAsyncWebServer-esphome@3.2.2
