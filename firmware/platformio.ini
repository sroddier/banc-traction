; Banc de traction — Lycée Antonin Artaud / BTS MS / FabLab
; Cible : ESP32 DevKit (ou équivalent 38 broches)
;
; Flash firmware :  pio run -e esp32dev -t upload
; Flash pages web : pio run -e esp32dev -t uploadfs
; (les deux, dans cet ordre, après branchement USB)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  links2004/WebSockets@2.6.1
